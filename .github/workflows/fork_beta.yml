# Builds a pull request as a beta of the app. See FORK.md.
#
# Opt-in per pull request: add the "beta" label. While the label is on, every push to the
# pull request builds a new beta, "<upstream>.<forkBuild>-beta.<n>". F-Droid offers it as
# an update to the normal app on devices with "Unstable updates" turned on.
#
# Security notes:
# - This workflow never sees a secret. It only builds an unsigned APK and asks
#   fork_fdroid.yml on master to check, sign and publish it. The signing key stays in the
#   release environment, which is restricted to master.
# - Pull requests from other people's forks are never built here.
# - Third-party actions are pinned to full commit SHAs.
name: Fork beta

on:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions: {}

concurrency:
  group: fork-beta-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      contains(github.event.pull_request.labels.*.name, 'beta') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: "25"
          distribution: "temurin"

      # Also validates the checksum of the Gradle wrapper jar
      - name: gradle setup
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: next beta number
        id: number
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "number=$(ci/fork-beta-number)" >> "$GITHUB_OUTPUT"

      - name: build beta apk
        run: ./gradlew assembleFdroidRelease -PforkBeta=${{ steps.number.outputs.number }}

      - name: save unsigned apk
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-beta-apk
          retention-days: 1
          if-no-files-found: error
          path: app/build/outputs/apk/fdroid/release/app-fdroid-release-unsigned.apk

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # To start fork_fdroid.yml on master
      actions: write
    steps:
      - name: sign and publish on master
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          gh workflow run fork_fdroid.yml --repo "$REPO" --ref master
          -f beta_run_id="$RUN_ID" -f pr_number="$PR_NUMBER" -f head_sha="$HEAD_SHA"
