# Builds this fork. See FORK.md.
#
# - Any branch: lint + unit tests + release build (no secrets involved).
# - master: release build, then a separate job signs the APK and publishes a
#   GitHub release plus an F-Droid repo on GitHub Pages, but only if the version
#   (see fork.properties) is new.
#
# Security notes:
# - The signing password only exists in the "release" environment, which is
#   restricted to master. Gradle (and all third-party build code) never runs
#   in a job that can see it.
# - Third-party actions are pinned to full commit SHAs.
name: Fork build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: fork-build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: "25"
          distribution: "temurin"

      # Also validates the checksum of the Gradle wrapper jar
      - name: gradle setup
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: lint and test
        if: github.ref != 'refs/heads/master'
        run: ./gradlew ktlintCheck testFdroidDebugUnitTest

      - name: build release apk
        run: ./gradlew assembleFdroidRelease

      - name: save unsigned apk
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-apk
          retention-days: 1
          if-no-files-found: error
          path: app/build/outputs/apk/fdroid/release/app-fdroid-release-unsigned.apk

  release:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Holds the SIGNING_PASSWORD secret. Restrict it to master in the repo settings.
    environment: release
    concurrency:
      group: fork-release
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: download unsigned apk
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-apk

      - name: install fdroidserver
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fdroidserver

      - name: sign and publish
        id: publish
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: ci/fork-release app-fdroid-release-unsigned.apk

      - name: save F-Droid repo
        if: steps.publish.outputs.published == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  pages:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}repo
    permissions:
      pages: write
      id-token: write
    steps:
      - name: deploy F-Droid repo
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
